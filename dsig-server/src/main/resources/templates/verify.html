<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Verify Document')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container" style="max-width: 650px;">
    <div class="card">
        <h2 class="card-title">Verify Digital Document</h2>
        <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
            Provide the received document along with its corresponding <code>.dsig.json</code> signature envelope to verify integrity and signer authenticity.
        </p>
        <div th:replace="~{fragments/flash :: flash}"></div>

        <form id="verifyForm" th:action="@{/verify}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="document">Received Document</label>
                <input type="file" id="document" name="document" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="envelope">Signature Envelope (.dsig.json)</label>
                <input type="file" id="envelope" name="envelope" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Verify Authenticity &amp; Integrity</button>
        </form>
    </div>
</div>
<script th:src="@{/js/verify.js}"></script>
</body>
</html>
