<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container" style="max-width: 450px;">
    <div class="card">
        <h2 class="card-title">Create Account</h2>
        <div th:replace="~{fragments/flash :: flash}"></div>

        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="role">Role</label>
                <select id="role" name="role" class="form-control">
                    <option value="ROLE_VERIFIER">Verifier</option>
                    <option value="ROLE_SIGNER">Signer</option>
                    <option value="ROLE_ADMIN">Administrator</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
        </form>
        <p style="margin-top: 1rem; font-size: 0.85rem; color: var(--text-muted); text-align: center;">
            Already have an account? <a th:href="@{/login}" style="color: var(--accent-blue);">Sign in</a>
        </p>
    </div>
</div>
</body>
</html>
