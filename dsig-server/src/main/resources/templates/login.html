<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container" style="max-width: 450px;">
    <div class="card">
        <h2 class="card-title">Sign In</h2>
        <div th:if="${param.error}" class="alert alert-danger">Invalid credentials or account locked.</div>
        <div th:if="${param.logout}" class="alert alert-success">You have been logged out securely.</div>
        <div th:if="${param.registered}" class="alert alert-success">Account created! Please sign in.</div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
        </form>
        <p style="margin-top: 1rem; font-size: 0.85rem; color: var(--text-muted); text-align: center;">
            Don't have an account? <a th:href="@{/register}" style="color: var(--accent-blue);">Register</a>
        </p>
    </div>
</div>
</body>
</html>
