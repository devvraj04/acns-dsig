<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<div th:fragment="flash">
    <div th:if="${success}" class="alert alert-success glass-card border border-emerald-300 text-emerald-900 bg-emerald-50/80 px-4 py-3 rounded-xl mb-4 flex items-center space-x-2">
        <svg class="w-5 h-5 text-emerald-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
        <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="alert alert-danger glass-card border border-rose-300 text-rose-900 bg-rose-50/80 px-4 py-3 rounded-xl mb-4 flex items-center space-x-2">
        <svg class="w-5 h-5 text-rose-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
        <span th:text="${error}"></span>
    </div>
</div>
</body>
</html>
